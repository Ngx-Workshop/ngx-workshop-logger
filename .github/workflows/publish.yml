name: Publish ngx-workshop-logger
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngx-workshop-logger-npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.repository.name, 'seed-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run pack
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.0
      - name: Publish built package
        working-directory: dist/ngx-workshop-logger
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm publish --access public
